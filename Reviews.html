<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send feedback on a More Smiles Games browser game.">
  <meta name="theme-color" content="#101018">
  <title>Reviews | More Smiles Games</title>
  <link rel="icon" href="Images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html"><img src="Images/nomoresmiles-pfp.png" alt="" width="38" height="38">More Smiles<span>Games</span></a>
    <nav aria-label="Main navigation"><a href="index.html#games">Games</a><a href="Reviews.html" aria-current="page">Reviews</a><a href="changelog.html">Changelog</a></nav>
  </div>
</header>
<main id="main" class="wrap text-page">
  <div class="page-heading"><h1>Leave a review</h1><p>What did you enjoy? What would you change?</p></div>
  <form id="formE1" class="panel review-form">
    <div class="field-row">
      <label>Game
        <select id="gamePick" name="game">
          <option value="Space Game">Space Game</option>
          <option value="Mop or Drop">Mop or Drop</option>
          <option value="Delivery Dillemmas">Delivery Dilemmas</option>
          <option value="Fishy Business">Fishy Business</option>
          <option value="Pebble Platformer">Pebble Platformer</option>
          <option value="Spider Chase">Spider Chase</option>
        </select>
      </label>
      <label>Rating
        <select id="rating" name="rating">
          <option value="5">5 out of 5</option>
          <option value="4">4 out of 5</option>
          <option value="3">3 out of 5</option>
          <option value="2">2 out of 5</option>
          <option value="1">1 out of 5</option>
        </select>
      </label>
    </div>
    <label>Your feedback <span class="muted">(optional)</span>
      <textarea id="feedback" name="feedback" rows="5" placeholder="Tell me about your experience"></textarea>
    </label>
    <button id="submitBtn" class="button" type="submit" disabled>Send review</button>
    <p id="thanksMessage" role="status"></p>
    <noscript><p>Enable JavaScript to send a review.</p></noscript>
  </form>
</main>
<footer class="site-footer">
  <div class="wrap footer-inner"><span>More Smiles Games &middot; &copy; 2026 MilesOfSmiles</span><a href="index.html#games">Browse games</a></div>
</footer>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIooZdbumKPwJ8PXYgl7K3KzB-UimVruM",
  authDomain: "website-ff524.firebaseapp.com",
  projectId: "website-ff524",
  storageBucket: "website-ff524.appspot.com",
  messagingSenderId: "387337435881",
  appId: "1:387337435881:web:140fe78b94094972c78e78",
  measurementId: "G-5BWCEXFB08"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const form = document.getElementById("formE1");
const game = document.getElementById("gamePick");
const submitButton = document.getElementById("submitBtn");
const status = document.getElementById("thanksMessage");
const requestedGame = new URLSearchParams(location.search).get("game");
if (Array.from(game.options).some(option => option.value === requestedGame)) {
  game.value = requestedGame;
}
submitButton.disabled = false;

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  status.textContent = "Sending review...";
  const { game, rating, feedback } = Object.fromEntries(new FormData(form));
  try {
    await addDoc(collection(db, "reviews"), {
      game,
      rating: Number(rating),
      feedback,
      createdAt: new Date()
    });
    form.elements.feedback.value = "";
    status.textContent = "Thanks for your review!";
  } catch {
    status.textContent = "Your review could not be sent. Please try again.";
  } finally {
    submitButton.disabled = false;
  }
});
</script>
</body>
</html>
