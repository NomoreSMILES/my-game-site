<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave a Review</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }
    #reviewForm {
      background: white;
      padding: 1rem;
      max-width: 500px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    textarea {
      width: 100%;
      resize: vertical;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home🏠 || </a>
  <a href="changelog.html">ChangeLog📝 || </a>
  <a href="spacegame.html">SpaceGame🚀 || </a>
  <a href="PebblePlatformer.html">Pebble Platformer🪨 || </a>
  <a href="SpiderGame.html">Spider Game 🕷️ || </a>
  <a href="DeliveryDillemmas.html">Delivery Dillemmas 📦 || </a>
  <a href="FishyBusiness.html">Fishy Business 🐟</a>
</nav>

<h2>Leave a Review</h2>

<div id="reviewForm">
  <label for="gamePick">What game are you reviewing?</label><br>
  <select id="gamePick">
    <option value="Space Game">Space Game 🚀</option>
    <option value="Pebble Platformer">Pebble Platformer 🪨</option>
    <option value="Spider Chase">Spider Game 🕷️</option>
    <option value="Delivery Dillemmas">Delivery Dillemmas 📦</option>
    <option value="Fishy Business">Fishy Business 🐟</option>
  </select><br><br>

  <label for="rating">Stars:</label><br>
  <select id="rating">
    <option value="1">⭐</option>
    <option value="2">⭐⭐</option>
    <option value="3">⭐⭐⭐</option>
    <option value="4">⭐⭐⭐⭐</option>
    <option value="5">⭐⭐⭐⭐⭐</option>
  </select><br><br>

  <label for="feedback">Your Feedback:</label><br>
  <textarea id="feedback" rows="4" placeholder="Type something here..."></textarea><br><br>

  <button id="submitBtn">Submit</button>

  <div id="thanksMessage" style="display:none; color: green;">Thanks for your review!</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAIooZdbumKPwJ8PXYgl7K3KzB-UimVruM",
    authDomain: "website-ff524.firebaseapp.com",
    projectId: "website-ff524",
    storageBucket: "website-ff524.appspot.com",
    messagingSenderId: "387337435881",
    appId: "1:387337435881:web:140fe78b94094972c78e78",
    measurementId: "G-5BWCEXFB08"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const submitBtn = document.getElementById('submitBtn');
  const thanksMessage = document.getElementById('thanksMessage');

  submitBtn.addEventListener('click', async () => {
    const gameName = document.getElementById('gamePick').value;
    const rating = parseInt(document.getElementById('rating').value);
    const feedback = document.getElementById('feedback').value;

    try {
      await addDoc(collection(db, "reviews"), {
        game: gameName,
        rating,
        feedback,
        createdAt: new Date()
      });

      document.getElementById('reviewForm').reset();
      thanksMessage.style.display = 'block';
    } catch (error) {
      alert("Error submitting review: " + error.message);
    }
  });
</script>

</body>
</html>
